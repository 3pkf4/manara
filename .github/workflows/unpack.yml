name: unpack
on:
  push:
    paths: ['manara.zip']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o manara.zip
          rm manara.zip
          git config user.name "unpack"
          git config user.email "unpack@users.noreply.github.com"
          git add -A
          git commit -m "Add Manara v2.8"
          git push
