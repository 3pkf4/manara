name: db-backup
on:
  schedule: [{ cron: '30 1 * * *' }]
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: dump + encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" && test ${#BACKUP_PASSPHRASE} -ge 16
          docker run --rm -e DATABASE_URL postgres:18-alpine sh -c 'pg_dump "$DATABASE_URL" --no-owner --no-acl' \
            | gzip | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE > manara-$(date +%Y%m%d).sql.gz.enc
          test "$(stat -c%s manara-*.sql.gz.enc)" -gt 1000
          ls -la manara-*.sql.gz.enc
      - uses: actions/upload-artifact@v4
        with: { name: backup, path: manara-*.sql.gz.enc, retention-days: 30, if-no-files-found: error }
